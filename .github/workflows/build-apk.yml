name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build Optimized APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahva-gallery-apk
          path: android/app/build/outputs/apk/release/mahva-gallery.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Mahva Gallery (Latest Build)' }}
          body: |
            ## 𓋞 Mahva Gallery Gold Calculator

            ### 📱 Android Download
            Download **`mahva-gallery.apk`** below directly to your device.

            ### 🍎 iPhone (iOS) Web App
            Open [https://mmshooreshi.github.io/gold-calc/](https://mmshooreshi.github.io/gold-calc/) in Safari $\rightarrow$ tap **Share** $\rightarrow$ **Add to Home Screen**.
          files: android/app/build/outputs/apk/release/mahva-gallery.apk
          draft: false
          prerelease: false

  deploy-pwa:
    name: Deploy PWA for iOS & Web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate SemVer version.json & Stamp Service Worker Cache
        run: |
          BUILD_NUM=${{ github.run_number }}
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          SEMVER="2.1.${BUILD_NUM}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # Generate version.json
          cat <<EOF > pwa/version.json
          {
            "version": "${SEMVER}",
            "build": ${BUILD_NUM},
            "sha": "${SHORT_SHA}",
            "fullSha": "${COMMIT_SHA}",
            "timestamp": "${TIMESTAMP}"
          }
          EOF
          
          # Stamp CACHE_NAME in sw.js automatically with this exact semver
          sed -i "s/const CACHE_NAME = .*/const CACHE_NAME = 'mahva-v${SEMVER}';/" pwa/sw.js
          
          echo "Generated version.json for Mahva PWA v${SEMVER} (commit ${SHORT_SHA})"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pwa'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
