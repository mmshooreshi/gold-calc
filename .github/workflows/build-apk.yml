name: Build & Release Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Mahva Gallery APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Build Optimized APK
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahva-gallery-apk
          path: android/app/build/outputs/apk/release/mahva-gallery.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Mahva Gallery (Latest Build)' }}
          body: |
            ## 𓋞 Mahva Gallery Gold Calculator

            ### 📱 Download & Install
            Download **`mahva-gallery.apk`** below directly to your Android device.

            - **Commit**: `${{ github.sha }}`
            - **Platform**: Android (120Hz Jetpack Compose)
          files: android/app/build/outputs/apk/release/mahva-gallery.apk
          draft: false
          prerelease: false
